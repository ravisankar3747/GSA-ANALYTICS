name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compare reports with Windows V7
        run: python tools/v7_parity.py
      - name: Generate standard Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin
      - name: Test, lint and build APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Name downloadable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GSA-ANALYTICS-V7-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GSA-ANALYTICS-V7-Android-APK
          path: GSA-ANALYTICS-V7-Android.apk
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/com.gsa.analytics/files/ device-test-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            device-test-output/

